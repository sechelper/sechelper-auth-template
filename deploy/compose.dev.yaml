services:
  api:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-development
    command: ["--config", "/app/config.yaml"]
    environment:
      APP_ENV: ${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
      LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: change-me
      REDIS_URL: redis://redis:6379/0
      PUBLIC_WEB_ORIGIN: http://localhost:8088
      API_ORIGIN: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8088
      IDENTITY_CLIENT_ID: local-client
      IDENTITY_CLIENT_SECRET: local-client-secret
      IDENTITY_APPLICATION_CODE: local-app
      SESSION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      METRICS_TOKEN: local-metrics-token
      TRUSTED_PROXY_CIDRS: 0.0.0.0/0
    volumes:
      - ./config.dev.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-idp:
        condition: service_healthy

  migrate:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-development
    entrypoint: ["/app/auth-template-migrate"]
    command: ["--config", "/app/config.yaml"]
    environment:
      APP_ENV: ${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
      INCLUDE_EXAMPLE_MIGRATIONS: ${INCLUDE_EXAMPLE_MIGRATIONS:-0}
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: change-me
    volumes:
      - ./config.dev.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: sechelper-auth-template-web:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-development
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

  mock-idp:
    image: sechelper-auth-template-mock-idp:development
    environment:
      MOCK_IDP_APPLICATION_CODE: local-app
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "/app/mock-idp", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-auth_template}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auth_template_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth_template_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_template_postgres_dev:
  auth_template_redis_dev:
