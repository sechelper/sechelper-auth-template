services:
  api:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-development
    command: ["--config", "/app/config.yaml"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CONFIG_CENTER_ENCRYPTION_KEY: ${CONFIG_CENTER_ENCRYPTION_KEY:?CONFIG_CENTER_ENCRYPTION_KEY is required}
      CONFIG_CENTER_INSTALL_KEY: ${CONFIG_CENTER_INSTALL_KEY:-}
    volumes:
      - ../config.example.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-idp:
        condition: service_healthy

  migrate:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-development
    entrypoint: ["/app/auth-template-migrate"]
    command: ["--config", "/app/config.yaml"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INCLUDE_EXAMPLE_MIGRATIONS: "1"
    volumes:
      - ../config.example.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: sechelper-auth-template-web:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-development
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

  mock-idp:
    image: sechelper-auth-template-mock-idp:development
    environment:
      MOCK_IDP_APPLICATION_CODE: local-app
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "/app/mock-idp", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-auth_template}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auth_template_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth_template_redis_dev:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_template_postgres_dev:
  auth_template_redis_dev:
