openapi: 3.0.3
info:
  title: Example Orders Module API
  version: 0.1.0
  description: Test/development-only read API for the orders example module. This contract is not part of the production artifact.
  license:
    name: Proprietary
    url: https://spdx.org/licenses/LicenseRef-Proprietary.html
servers:
  - url: /
paths:
  /v1/orders:
    get:
      operationId: listExampleOrders
      summary: List example orders
      description: Returns the first page of fictitious example records. The example implementation does not currently support a cursor or next-page parameter.
      security:
        - sessionCookie: []
      x-required-permissions: [admin:access, order:read]
      parameters:
        - in: query
          name: page[size]
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Example order collection
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  meta:
                    type: object
                    required: [hasMore]
                    properties:
                      hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: Example order storage is unavailable }
  /v1/orders/{orderId}:
    get:
      operationId: getExampleOrder
      summary: Read one example order
      security:
        - sessionCookie: []
      x-required-permissions: [admin:access, order:read]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Example order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Order not found }
        '502': { description: Example order storage is unavailable }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: auth_template_session
  responses:
    Unauthorized:
      description: Missing or expired session
    Forbidden:
      description: Authenticated caller lacks a required permission
  schemas:
    Order:
      type: object
      required: [id, status, totalMinor, currency, createdAt, updatedAt]
      properties:
        id: { type: string }
        status: { type: string }
        totalMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
