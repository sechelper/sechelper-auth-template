services:
  api:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
    command: ["--config", "/app/config.yaml"]
    environment:
      APP_ENV: ${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:8080}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      IDENTITY_CLIENT_ID: ${IDENTITY_CLIENT_ID:?IDENTITY_CLIENT_ID is required}
      IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?IDENTITY_CLIENT_SECRET is required}
      IDENTITY_APPLICATION_CODE: ${IDENTITY_APPLICATION_CODE:?IDENTITY_APPLICATION_CODE is required}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:?IDENTITY_JWKS_URL is required}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose: ["8080"]
    restart: unless-stopped

  migrate:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
    entrypoint: ["/app/auth-template-migrate"]
    command: ["--config", "/app/config.yaml"]
    environment:
      APP_ENV: ${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
      INCLUDE_EXAMPLE_MIGRATIONS: ${INCLUDE_EXAMPLE_MIGRATIONS:-0}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: sechelper-auth-template-web:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
    expose: ["80"]
    depends_on: [api]
    restart: unless-stopped

  postgres:
    image: postgres:16
    env_file: ../.env
    volumes:
      - auth_template_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auth_template_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_template_postgres:
  auth_template_redis:
