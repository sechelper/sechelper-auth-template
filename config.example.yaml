# First-run bootstrap configuration.
# Runtime variables are entered through /install and encrypted in the
# configuration center. Keep only non-secret startup defaults here.
bootstrap:
  databaseUrl: postgresql://app:change-me@127.0.0.1:5432/auth_template?sslmode=disable
  encryptionKey: replace-with-43-character-base64-key
  installKey: replace-with-a-one-time-install-key
app:
  environment: development
server:
  host: 127.0.0.1
  port: 8080
