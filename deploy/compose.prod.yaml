services:
  api:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
    command: ["--config", "/app/config.yaml"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CONFIG_CENTER_ENCRYPTION_KEY: ${CONFIG_CENTER_ENCRYPTION_KEY:?CONFIG_CENTER_ENCRYPTION_KEY is required}
      CONFIG_CENTER_INSTALL_KEY: ${CONFIG_CENTER_INSTALL_KEY:-}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose: ["8080"]
    restart: unless-stopped

  migrate:
    image: sechelper-auth-template-api:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
    entrypoint: ["/app/auth-template-migrate"]
    command: ["--config", "/app/config.yaml"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      INCLUDE_EXAMPLE_MIGRATIONS: ${INCLUDE_EXAMPLE_MIGRATIONS:-0}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: sechelper-auth-template-web:${RELEASE_VERSION:?release version required}-${BUILD_ID:?Build ID required}-${DEPLOYMENT_ENVIRONMENT:?select a deployment environment}
    expose: ["80"]
    depends_on: [api]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - auth_template_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - auth_template_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth_template_postgres:
  auth_template_redis:
