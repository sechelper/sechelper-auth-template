openapi: 3.0.3
info:
  title: Unified Authentication Business Shell API
  version: 0.1.0
  license:
    name: Proprietary
    url: https://spdx.org/licenses/LicenseRef-Proprietary.html
servers:
  - url: /
security: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check process health
      responses:
        '200':
          description: Service is alive
        '500':
          description: Health handler failed unexpectedly
  /readyz:
    get:
      operationId: readinessCheck
      summary: Check dependency readiness
      responses:
        '200':
          description: Service is ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/login:
    get:
      operationId: startLogin
      summary: Start Confidential Client login
      parameters:
        - in: query
          name: prompt
          required: false
          schema: { type: string, enum: [none, login], default: login }
          description: OIDC prompt mode. `none` attempts silent SSO and falls back to interactive login in the browser.
      responses:
        # This operation intentionally returns a redirect rather than a 2xx body.
        '302':
          description: Redirect to the identity platform
        '400':
          description: The prompt query parameter is invalid
        '502':
          description: Identity platform is unavailable
  /v1/auth/callback:
    get:
      operationId: completeLogin
      summary: Handle the authorization code callback
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        # This operation intentionally returns a redirect rather than a 2xx body.
        '302': { description: Redirect to the configured web origin or back to interactive login after silent SSO is unavailable }
        '401':
          description: Authentication failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/auth/session:
    get:
      operationId: getSession
      summary: Read current business session
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '500':
          description: Session status could not be returned
  /v1/account/me:
    get:
      operationId: getCurrentAccount
      summary: Read the current authenticated user's identity profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current account profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/version:
    get:
      operationId: getBuildVersion
      summary: Read release and deployment build metadata
      responses:
        '200':
          description: Public release metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '500':
          description: Release metadata could not be returned
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke current business session
      responses:
        '200': { description: 'Local session revoked; an OIDC end-session URL may also be returned.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Logout state could not be created }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh the server-side Confidential Client session
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Session refreshed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/auth/logout/callback:
    get:
      operationId: completeLogout
      summary: Validate the OIDC logout callback
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '200': { description: Logout callback accepted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/authorization/me:
    get:
      operationId: getAuthorization
      summary: Read current Application authorization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current authorization
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [subject, identitySubject, applicationCode, permissions]
                    properties:
                      subject:
                        type: string
                        description: Deprecated compatibility alias for identitySubject; the unchanged subject claim from the configured identity issuer.
                      identitySubject:
                        type: string
                        description: Opaque, issuer-scoped user identifier from the identity platform subject claim, passed through without transformation. This field is not guaranteed to be a UUID.
                      platformUserUuid:
                        type: string
                        format: uuid
                        description: Stable UUID generated by this platform instance on first successful login; absent only for sessions created before the identity mapping migration.
                      applicationCode: { type: string }
                      permissions:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/admin/access-decisions/check:
    post:
      operationId: checkAccessDecision
      summary: Explain a resource access decision
      description: Evaluates the current administrator against a registered resource action. This endpoint is diagnostic only and does not return the resource or bypass the resource API.
      security:
        - sessionCookie: []
      x-required-permission: admin:access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, resourceId, action]
              properties:
                resourceType: { type: string, minLength: 1 }
                resourceId: { type: string, minLength: 1 }
                action: { type: string, minLength: 1 }
      responses:
        '200':
          description: Access decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecisionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Resource or action is invalid }
  /v1/admin/resources:
    get:
      operationId: listResources
      summary: List registered resource definitions
      description: Lists resource types and actions declared by application modules. It does not list users, roles, or resource records.
      security:
        - sessionCookie: []
      x-required-permission: admin:access
      responses:
        '200':
          description: Registered resources
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceDefinition'
                  meta:
                    type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/dashboard/overview:
    get:
      operationId: getDashboardOverview
      summary: Read platform dashboard overview
      description: Returns application, current session, dependency health, Manifest status, and an optional host-resource snapshot. It intentionally does not include business metrics.
      security:
        - sessionCookie: []
      x-required-permission: admin:access
      responses:
        '200':
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverviewResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/dashboard/resources:
    get:
      operationId: getDashboardResources
      summary: Read the latest server resource sample
      description: Returns only the latest server resource snapshot for high-frequency dashboard charts. It does not probe dependencies or query business data.
      security:
        - sessionCookie: []
      x-required-permission: admin:access
      responses:
        '200':
          description: Latest server resource sample
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResourceSnapshotResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/admin/account:
    get:
      operationId: getAdminAccount
      summary: Read current administrator account context
      security: [{ sessionCookie: [] }]
      x-required-permission: auth:session
      responses:
        '200':
          description: Current account context, including external and platform-local user identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [subject, identitySubject, applicationCode, permissions]
                    properties:
                      subject:
                        type: string
                        deprecated: true
                        description: Compatibility alias for identitySubject.
                      identitySubject:
                        type: string
                        description: Opaque, issuer-scoped subject claim from the configured identity issuer; not guaranteed to be a UUID.
                      platformUserUuid:
                        type: string
                        format: uuid
                        description: Local stable UUID; absent for pre-migration sessions.
                      applicationCode: { type: string }
                      permissions:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/permissions:
    get:
      operationId: listPermissions
      summary: List permissions registered by this Application
      security: [{ sessionCookie: [] }]
      x-required-permission: auth:manifest:read
      responses:
        '200': { description: Permission collection }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List platform audit events
      security: [{ sessionCookie: [] }]
      x-required-permission: audit:read
      parameters:
        - in: query
          name: page[size]
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: filter[eventType]
          schema: { type: string }
        - in: query
          name: filter[category]
          schema: { type: string, enum: [authentication, authorization, resource, manifest, operations] }
        - in: query
          name: filter[severity]
          schema: { type: string, enum: [info, warning, critical] }
        - in: query
          name: filter[outcome]
          schema: { type: string, enum: [success, failure, denied] }
        - in: query
          name: filter[actorSubject]
          schema: { type: string }
        - in: query
          name: filter[resourceType]
          schema: { type: string }
        - in: query
          name: filter[resourceId]
          schema: { type: string }
        - in: query
          name: filter[from]
          schema: { type: string, format: date-time }
        - in: query
          name: filter[to]
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Key audit event collection
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  meta:
                    type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/configuration:
    get:
      operationId: listConfigurationEntries
      summary: List configuration-center entries
      security: [{ sessionCookie: [] }]
      x-required-permission: configuration:read
      responses:
        '200':
          description: Configuration metadata; values are not returned by this endpoint. Clients may use the detail endpoint for non-secret values only.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ConfigurationEntry' } }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/configuration/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,127}$' }
    get:
      operationId: getConfigurationEntry
      summary: Read configuration metadata and non-secret value
      security: [{ sessionCookie: [] }]
      x-required-permission: configuration:read
      responses:
        '200': { description: Entry metadata and value for non-secret entries; secret values are always blank }
        '404': { description: Entry not found }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: upsertConfigurationEntry
      summary: Create or replace an encrypted configuration value
      security: [{ sessionCookie: [] }]
      x-required-permission: configuration:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, minLength: 1, writeOnly: true }
                description: { type: string }
                isSecret: { type: boolean, default: true }
      responses:
        '200': { description: Entry metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      operationId: deleteConfigurationEntry
      summary: Delete a configuration value
      security: [{ sessionCookie: [] }]
      x-required-permission: configuration:write
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/operations/overview:
    get:
      operationId: getOperationsOverview
      summary: Read operations overview and runtime metrics
      security: [{ sessionCookie: [] }]
      x-required-permission: admin:access
      responses:
        '200': { description: Operations overview }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/deployment/guide:
    get:
      operationId: getDeploymentGuide
      summary: Read framework deployment readiness
      description: Returns non-secret bootstrap, configuration-center, migration, dependency, and build readiness checks. It never returns passwords, tokens, encryption keys, or connection strings.
      security: [{ sessionCookie: [] }]
      x-required-permission: admin:access
      responses:
        '200':
          description: Deployment readiness guide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentGuideResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/internal/authorization-manifest:
    get:
      operationId: getManifestState
      summary: Read Manifest synchronization state
      security:
        - sessionCookie: []
      x-required-permission: auth:manifest:read
      responses:
        '200':
          description: Manifest state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/internal/authorization-manifest/sync:
    post:
      operationId: syncManifest
      summary: Synchronize the local Manifest to the identity platform
      security:
        - sessionCookie: []
      x-required-permission: auth:manifest:sync
      responses:
        '200':
          description: Manifest synchronization state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: Identity platform rejected or could not complete synchronization }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: auth_template_session
  responses:
    Unauthorized:
      description: Missing or expired session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated caller lacks the required permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: The latest resource snapshot is not available yet
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        subject:
          type: string
          description: Deprecated compatibility alias for identitySubject; the unchanged subject claim from the configured identity issuer.
        identitySubject:
          type: string
          description: Opaque, issuer-scoped user identifier from the identity platform subject claim, passed through without transformation. This field is not guaranteed to be a UUID.
        platformUserUuid:
          type: string
          format: uuid
          description: Stable UUID generated by this platform instance on first successful login; absent only for sessions created before the identity mapping migration.
        email: { type: string }
        applicationCode: { type: string }
        permissions:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time }
    CurrentAccountResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subject, identitySubject, email, applicationCode, profile]
          properties:
            subject: { type: string, description: Deprecated compatibility alias for identitySubject. }
            identitySubject: { type: string, description: Opaque issuer-scoped identity subject. }
            platformUserUuid: { type: string, format: uuid }
            email: { type: string }
            applicationCode: { type: string }
            profile: { type: object, additionalProperties: true }
    ConfigurationEntry:
      type: object
      required: [key, isSecret, version, updatedAt]
      properties:
        key: { type: string }
        description: { type: string }
        isSecret: { type: boolean }
        version: { type: integer, format: int64 }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        value: { type: string, description: Only present for non-secret reads; secret values are never returned. }
    DeploymentGuideResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [application, bootstrap, configuration, checks, ready]
          properties:
            application:
              type: object
              required: [name, version, environment, buildId, sourceRevision, startedAt]
              properties:
                name: { type: string }
                version: { type: string }
                environment: { type: string, enum: [development, test, production] }
                buildId: { type: string }
                sourceRevision: { type: string }
                startedAt: { type: string, format: date-time }
            bootstrap: { type: array, items: { $ref: '#/components/schemas/DeploymentCheck' } }
            configuration: { type: array, items: { $ref: '#/components/schemas/DeploymentCheck' } }
            checks: { type: array, items: { $ref: '#/components/schemas/DeploymentCheck' } }
            ready: { type: boolean }
    DeploymentCheck:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [healthy, attention, unavailable] }
        message: { type: string }
    VersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [releaseVersion, deploymentEnvironment, buildId, sourceRevision]
          properties:
            releaseVersion: { type: string }
            deploymentEnvironment: { type: string, enum: [development, test, production] }
            buildId: { type: string, description: Release ID is UTC YYYYMMDDHHmmss; development may use dev-local. }
            sourceRevision: { type: string, description: Full source commit SHA for release builds; working-tree for local development. }
    ManifestStateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [applicationCode, manifestVersion, status, serverRevision]
          properties:
            applicationCode: { type: string }
            manifestVersion: { type: integer, format: int64 }
            contentHash: { type: string }
            canonicalJson: { type: string }
            syncId: { type: string }
            status: { type: string }
            serverRevision: { type: integer, format: int64 }
            acceptedAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ServerResourceSnapshotResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ServerResourceSnapshot'
    ServerResourceSnapshot:
      type: object
      description: A sampled Linux host and Go API resource snapshot. Metrics unavailable on the host are null.
      required: [sampledAt, cpuPercent, memoryPercent, memoryUsedBytes, memoryTotalBytes, diskPercent, diskUsedBytes, diskTotalBytes, goroutines]
      properties:
        sampledAt: { type: string, format: date-time, description: UTC time when the resource snapshot was collected. }
        cpuPercent: { type: number, format: float, minimum: 0, maximum: 100, nullable: true, description: Aggregate Linux host CPU utilization since the previous 500 ms sample; null until two valid samples exist or procfs is unavailable. }
        memoryPercent: { type: number, format: float, minimum: 0, maximum: 100, nullable: true, description: "Linux host memory used as a percentage of total, using MemTotal minus MemAvailable." }
        memoryUsedBytes: { type: integer, format: int64, minimum: 0, nullable: true, description: Linux host memory used in bytes. }
        memoryTotalBytes: { type: integer, format: int64, minimum: 0, nullable: true, description: Linux host total memory in bytes. }
        diskPercent: { type: number, format: float, minimum: 0, maximum: 100, nullable: true, description: Used space percentage on the filesystem containing the API working directory. The filesystem path is not returned. }
        diskUsedBytes: { type: integer, format: int64, minimum: 0, nullable: true, description: Used bytes on the filesystem containing the API working directory. }
        diskTotalBytes: { type: integer, format: int64, minimum: 0, nullable: true, description: Total bytes on the filesystem containing the API working directory. }
        goroutines: { type: integer, minimum: 0, description: Current goroutine count in this Go API process. }
    DashboardOverviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [application, currentSession, dependencies, manifest]
          properties:
            application:
              type: object
              required: [name, version, environment, buildId, sourceRevision, startedAt]
              properties:
                name: { type: string }
                version: { type: string }
                environment: { type: string, enum: [development, test, production] }
                buildId: { type: string, description: Release ID is UTC YYYYMMDDHHmmss; development may use dev-local. }
                sourceRevision: { type: string, description: Full source commit SHA for release builds; working-tree for local development. }
                startedAt: { type: string, format: date-time }
            currentSession:
              type: object
              required: [subject, applicationCode, permissionCount]
              properties:
                subject: { type: string }
                applicationCode: { type: string }
                permissionCount: { type: integer, minimum: 0 }
            dependencies:
              type: object
              additionalProperties:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [healthy, degraded, unavailable, not_configured, not_synced] }
                  latencyMs: { type: integer, minimum: 0 }
                  message: { type: string }
            manifest:
              type: object
              required: [status]
              properties:
                applicationCode: { type: string }
                version: { type: integer, format: int64 }
                status: { type: string }
                contentHash: { type: string }
                serverRevision: { type: integer, format: int64 }
                updatedAt: { type: string, format: date-time }
            resources:
              $ref: '#/components/schemas/ServerResourceSnapshot'
    AccessDecisionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [allowed, reasonCode, resourceType, resourceId, action]
          properties:
            allowed: { type: boolean }
            reasonCode: { type: string }
            permission: { type: string }
            resourceType: { type: string }
            resourceId: { type: string }
            action: { type: string }
    ResourceDefinition:
      type: object
      required: [type, actions]
      properties:
        type: { type: string }
        name: { type: string }
        description: { type: string }
        actions:
          type: array
          items:
            type: object
            required: [name, permission]
            properties:
              name: { type: string }
              permission: { type: string }
    AuditEvent:
      type: object
      required: [id, occurredAt, eventType, category, severity, outcome, actorSubject, applicationCode, source]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        eventType: { type: string }
        category: { type: string, enum: [authentication, authorization, resource, manifest, operations, business] }
        severity: { type: string, enum: [info, warning, critical] }
        outcome: { type: string, enum: [success, failure, denied] }
        reasonCode: { type: string }
        actorSubject: { type: string }
        actorEmail: { type: string }
        applicationCode: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        action: { type: string }
        requestId: { type: string }
        correlationId: { type: string }
        source: { type: string }
        metadata: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
            requestId: { type: string }
