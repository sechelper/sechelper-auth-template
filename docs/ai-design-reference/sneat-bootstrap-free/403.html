<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>403 · 暂无访问权限</title>
    <style>
      :root { font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #384551; background: #f5f5f9; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
      main { width: min(420px, 100%); padding: 40px 32px 32px; border-radius: 8px; background: #fff; box-shadow: 0 3px 8px rgba(34, 48, 62, .1); text-align: center; }
      .code { margin: 0; color: #ffab00; font: 800 80px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.1em; }
      h1 { margin: 24px 0 8px; font-size: 20px; font-weight: 600; }
      p { margin: 0; color: #646e78; font-size: 14px; }
      button { margin-top: 24px; padding: 10px 16px; border: 0; border-radius: 6px; color: #fff; background: #ffab00; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500; }
    </style>
  </head>
  <body><main><p class="code" aria-hidden="true">403</p><h1>暂无访问权限</h1><p>当前账号无法访问此页面。</p><button type="button">返回管理概览</button></main></body>
</html>
